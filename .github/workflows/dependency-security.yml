name: Python dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '24 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [current, minimum]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Resolve runtime dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          if [[ "${{ matrix.profile }}" == minimum ]]; then
            export PIP_CONSTRAINT="$PWD/tests/release/minimum.txt"
          fi
          "$RUNNER_TEMP/runtime/bin/python" -m pip install '.[legacy]'
          "$RUNNER_TEMP/runtime/bin/python" -m pip check
          "$RUNNER_TEMP/runtime/bin/python" -m pip freeze --exclude check-yourself-chess > "$RUNNER_TEMP/runtime.txt"
      - name: Check published Python advisories
        run: |
          python -m pip install pip-audit
          python -m pip_audit --vulnerability-service pypi --disable-pip --no-deps \
            -r "$RUNNER_TEMP/runtime.txt"
