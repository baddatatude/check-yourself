name: Publish Check Yourself to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/tags/v0.2.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build and verify distributions
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          export PATH="/usr/games:$PATH"
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          PYTHON=python bash tests/release/check-wheel.sh dist/*.whl
          sha256sum dist/*.whl dist/*.tar.gz | tee SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-distributions
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-distributions
          path: bundle
      - name: Check distribution hashes
        working-directory: bundle
        run: sha256sum -c SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: bundle/dist/
