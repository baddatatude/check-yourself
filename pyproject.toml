[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "check-yourself-chess"
version = "0.2.0"
description = "Analyze local chess PGNs with Stockfish and generate offline reports."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["COPYING", "LICENSE.MIT", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{ name = "Check Yourself Contributors" }]
keywords = ["chess", "stockfish", "analysis", "pgn"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
  "chess>=1.10",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.29.2",
  "rich>=13.8.0",
]

[project.optional-dependencies]
html = ["jinja2>=3.1.6", "plotly>=5.22"]
legacy = ["check-yourself-chess[html]", "httpx>=0.27"]
dev = [
  "check-yourself-chess[legacy]",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-Jinja2",
]

[project.scripts]
check-yourself = "check_yourself.cli:app"

[project.urls]
Homepage = "https://github.com/baddatatude/check-yourself"
Documentation = "https://github.com/baddatatude/check-yourself#readme"
Issues = "https://github.com/baddatatude/check-yourself/issues"

# Exclude pending-provenance assets even from a working directory with local copies.
[tool.hatch.build]
exclude = [
  "/src/check_yourself/data/openings.json",
  "/src/check_yourself/reports/static/*.png",
  "/src/check_yourself/reports/static/*.ico",
  "/docs/placeholders/report-preview.svg",
  "/src/check_yourself/analysis/opening_study.py",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/check_yourself"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
  "src/check_yourself",
  "tests",
  "docs",
  "examples",
  "README.md",
  "LICENSE",
  "COPYING",
  "LICENSE.MIT",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: live network or real Stockfish (deselected by default)",
]
addopts = "-q -m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Typer uses Option()/Argument() in signatures by design

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["check_yourself"]
mypy_path = "src"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["plotly.*", "chess.*"]
ignore_missing_imports = true
