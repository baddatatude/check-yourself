[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "check-yourself-chess"
version = "0.2.0"
description = "Download Chess.com or Lichess games, analyze them with Stockfish, and generate visual reports."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Check Yourself Contributors" }]
keywords = ["chess", "stockfish", "chess.com", "analysis", "pgn"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
  "chess>=1.10",
  "httpx>=0.27",
  "jinja2>=3.1",
  "plotly>=5.22",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-Jinja2",
]

[project.scripts]
check-yourself = "check_yourself.cli:app"

[project.urls]
Homepage = "https://github.com/example/check-yourself"
Documentation = "https://github.com/example/check-yourself#readme"
Issues = "https://github.com/example/check-yourself/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/check_yourself"]

[tool.hatch.build.targets.sdist]
include = [
  "src/check_yourself",
  "tests",
  "docs",
  "examples",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: live network or real Stockfish (deselected by default)",
]
addopts = "-q -m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Typer uses Option()/Argument() in signatures by design

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["check_yourself"]
mypy_path = "src"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["plotly.*", "chess.*"]
ignore_missing_imports = true
